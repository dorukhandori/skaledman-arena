<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a1c" />
    <title>Skaledman Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+15&family=Jost:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Skaledman görsel dili (docs/research/skaledman-sayfa-analizi.md § 3): koyu gece zemini, 3–4 px sert
         kenarlık + 0 4px 0 düşen gölge, krem RPG penceresi, Jersey piksel yazısı. Logo/marka alınmaz. */
      :root {
        --night: #070a1c;
        --bg: #0c191d;
        --panel: #10222a;
        --panel-2: #173039;
        --edge: #24414b;
        --shade: #050d10;
        --ink: #f3f1e8;
        --muted: #a3b2b6;
        --faint: #6f8287;
        --gold: #f4cf47;
        --red: #e3350d;
        --kick: #53fc18;
        --cream: #eef2f5; /* krem pencere zemini (Skaledman --paper-ui) */
        --ink-ui: #1d2230;
        --frame: #f4cf47; --frame-2: #d9ac24; --paper: #f4f0e3;
        --display: "Jersey 10", "Nunito Sans", system-ui, sans-serif;
        --pixel: "Jersey 15", "Nunito Sans", system-ui, sans-serif;
        --card-font: "Jost", "Nunito Sans", system-ui, sans-serif;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font: 400 15px/1.5 "Nunito Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      body { display: grid; grid-template-rows: auto 1fr; }
      :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
      button { font: inherit; color: inherit; }

      /* üst çubuk */
      body > header { display: flex; gap: 22px; align-items: center; height: 50px; padding: 0 18px; background: rgba(7, 10, 28, .92); border-bottom: 3px solid var(--shade); }
      header h1 { margin: 0; display: flex; align-items: center; gap: 10px; font: 400 30px/1 var(--display); color: var(--ink); letter-spacing: .5px; text-shadow: 0 3px 0 var(--shade); }
      header h1 span { padding: 2px 9px 3px; border-radius: 7px; background: var(--gold); color: #2a2104; font: 400 17px/1.2 var(--pixel); box-shadow: 0 3px 0 #9c7b14; text-shadow: none; }
      header nav { display: flex; gap: 6px; }
      header nav a { position: relative; padding: 4px 12px 2px 22px; border-radius: 8px; color: var(--muted); font: 400 21px/1.2 var(--pixel); text-decoration: none; transition: color .15s, background .15s; }
      header nav a::before { content: ""; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); border: 6px solid transparent; border-left: 8px solid var(--red); border-right: 0; opacity: 0; }
      header nav a:hover { color: var(--ink); }
      header nav a[aria-current="page"] { color: var(--ink); background: rgba(255, 255, 255, .08); }
      header nav a[aria-current="page"]::before { opacity: 1; }

      #sahne { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #sahne canvas { display: block; image-rendering: pixelated; }
      #ustYazi { position: absolute; inset: 0; pointer-events: none; }
      #ustYazi > * { pointer-events: auto; }

      /* oyun düğmesi: sert gölge, basınca iner; üzerine gelince menü imleci */
      .btn { position: relative; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 2px 18px 0 26px; border-radius: 10px;
        border: 3px solid var(--shade); background: var(--panel-2); color: var(--ink); font: 400 20px/1 var(--pixel); cursor: pointer; text-decoration: none;
        box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25), inset 0 2px 0 rgba(255, 255, 255, .08), 0 4px 0 var(--shade); transition: transform .08s, box-shadow .08s, background .2s; }
      .btn::before { content: ""; position: absolute; left: 10px; top: 50%; border: 5px solid transparent; border-left: 7px solid currentColor; border-right: 0; transform: translate(-3px, -50%); opacity: 0; transition: opacity .15s, transform .15s; }
      .btn:hover::before, .btn:focus-visible::before, .btn[aria-pressed="true"]::before { opacity: 1; transform: translate(0, -50%); }
      .btn:hover { background: #1d3a44; }
      .btn:active { transform: translateY(3px); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25), 0 1px 0 var(--shade); }
      .btn.kucuk { height: 32px; padding: 2px 12px 0 20px; border-radius: 8px; font-size: 18px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25), 0 3px 0 var(--shade); }
      .btn.kucuk::before { left: 7px; }
      .btn.birincil, .btn[aria-pressed="true"] { background: var(--gold); color: #2a2104; box-shadow: inset 0 -4px 0 #c99d1f, inset 0 2px 0 #fff3b8, 0 4px 0 var(--shade); }
      .btn.kucuk.birincil, .btn.kucuk[aria-pressed="true"] { box-shadow: inset 0 -3px 0 #c99d1f, inset 0 2px 0 #fff3b8, 0 3px 0 var(--shade); }
      .btn.birincil:hover, .btn[aria-pressed="true"]:hover { background: #ffdb5c; }

      /* RPG penceresi: krem zemin, çift iç çerçeve */
      .win { border: 4px solid var(--shade); border-radius: 14px; background: var(--cream); color: var(--ink-ui);
        box-shadow: inset 0 0 0 3px var(--cream), inset 0 0 0 5px #b9c4cf, 0 4px 0 rgba(0, 0, 0, .45); }
      /* pencere içi seçim düğmeleri: seçilene kırmızı imleç */
      .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 5px; }
      .seg button { position: relative; height: 30px; padding: 2px 10px 0 22px; border: 0; border-radius: 7px; background: none; color: #6b7585; font: 400 19px/1 var(--pixel); cursor: pointer; }
      .seg button::before { content: ""; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); border: 5px solid transparent; border-left: 7px solid var(--red); border-right: 0; opacity: 0; }
      .seg button:hover { color: var(--ink-ui); }
      .seg button[aria-pressed="true"] { color: var(--ink-ui); background: #dde4ea; }
      .seg button[aria-pressed="true"]::before { opacity: 1; }

      /* tip simgesi ve tip hapı */
      .tsimge { flex: none; width: 1.4em; height: 1.4em; vertical-align: middle; }
      .tcip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px 0 2px; border-radius: 99px; font-size: 11.5px; font-weight: 800; color: #fff; white-space: nowrap;
        background: color-mix(in srgb, var(--c) 80%, #fff); text-shadow: 0 1px 1px rgba(0, 0, 0, .3); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .16); }
      .tcip .tsimge { width: 18px; height: 18px; }

      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <header>
      <h1>SKALEDMAN ARENA <span>hayran yapımı</span></h1>
      <nav id="menu">
        <a href="?ekran=arena">Arena</a>
        <a href="?ekran=lab">Birleştirme Lab</a>
      </nav>
    </header>
    <div id="sahne"><div id="ustYazi"></div></div>
    <script type="module" src="/src/istemci/main.ts"></script>
  </body>
</html>
