<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18161d" />
    <title>Devran</title>
    <!-- Menü dili v2 · Kuşak Taşı (GU-01): jetonlar + bileşenler; yerel pixel yazı tipleri public/yazi/ (dış istek yok) -->
    <link rel="preload" href="/yazi/Jersey10-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/yazi/m5x7.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/src/istemci/stil/jetonlar.css" />
    <link rel="stylesheet" href="/src/istemci/stil/bilesenler.css" />
    <link rel="stylesheet" href="/src/istemci/stil/ekranlar.css" />
    <style>
      /* Devran kabuğu. Menü ekranlarında üst web gezinti çubuğu yok (KM-4): body.kabuk; geliştirici ekranlarında kalır. */
      :root {
        --night: #070a1c; --bg: #0b1418; --panel: #10222a; --panel-2: #173039; --edge: #24414b; --shade: #050d10;
        --ink: #f3f1e8; --muted: #a3b2b6; --gold: #f4cf47; --red: #e3350d;
        --display: "Trebuchet MS", "Nunito Sans", system-ui, sans-serif;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 400 15px/1.5 system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      body { display: grid; grid-template-rows: auto 1fr; }
      :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
      body > header { display: flex; gap: 22px; align-items: center; height: 40px; padding: 0 16px; background: rgba(7, 10, 28, .92); border-bottom: 3px solid var(--shade); }
      header h1 { margin: 0; font: 800 22px/1 var(--display); letter-spacing: 2px; }
      header h1 span { margin-left: 8px; padding: 2px 8px; border-radius: 6px; background: var(--gold); color: #2a2104; font: 800 12px/1.3 system-ui; letter-spacing: .5px; vertical-align: middle; }
      header nav a { color: var(--muted); font: 700 14px/1 system-ui; text-decoration: none; padding: 4px 10px; border-radius: 6px; }
      header nav a[aria-current="page"] { color: var(--ink); background: rgba(255, 255, 255, .08); }
      #sahne { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #sahne canvas { display: block; image-rendering: pixelated; }
      #ustYazi { position: absolute; inset: 0; pointer-events: none; }
      #ustYazi > * { pointer-events: none; }
      #ustYazi > .lab, #ustYazi > .lobi, #ustYazi > .ekr, #ustYazi > .k-zemin { pointer-events: auto; }
      /* D8 seyirci/OBS ve geliştirici kontakt levhası: üst bant yok, tuval tüm pencere */
      body.ciplak { grid-template-rows: 1fr; } body.ciplak > header { display: none; }
      body.kabuk { grid-template-rows: 1fr; background: #18161d; } body.kabuk > header { display: none; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="?ekran=atolye" style="color:inherit;text-decoration:none" aria-label="Devran: Atölye">DEVRAN</a> <span>D8</span></h1>
      <nav id="menu"></nav>
    </header>
    <div id="sahne"><div id="ustYazi"></div></div>
    <script type="module" src="/src/istemci/main.ts"></script>
  </body>
</html>
