name: Hata bildirimi
description: Oyunda, seyirci görünümünde, Lab'da ya da araçlarda bir şey yanlış çalışıyor
labels: ["hata"]
body:
  - type: textarea
    id: ne-oldu
    attributes:
      label: Ne oldu
      description: Beklenen ve gerçekleşen davranış.
    validations:
      required: true
  - type: textarea
    id: adimlar
    attributes:
      label: Nasıl tekrarlanır
      description: Adım adım. Varsa URL (`?ekran=mac&tohum=…&takim=…&rakip=…`, oda kodu, `#izle=` bağlantısı) tam hâliyle; tohum çevrimdışı maçı birebir tekrarlar.
      placeholder: |
        1. `npm run dev`
        2. `/?ekran=mac&tohum=7&takim=0&rakip=1`
        3. …
    validations:
      required: true
  - type: input
    id: kartlar
    attributes:
      label: Hangi takımlar / parçalar
      placeholder: "kor-goktasi:ok-govde:hafif-disk:duz-uc vs …"
  - type: input
    id: ortam
    attributes:
      label: Ortam
      description: Tarayıcı ve sürümü, işletim sistemi, Node sürümü; ağ hatasıysa gecikme/jitter/kayıp değerleri.
      placeholder: "Chrome 142, macOS 26, Node 22.12"
  - type: textarea
    id: kanit
    attributes:
      label: Ekran görüntüsü, konsol çıktısı, video
      description: Konsoldaki hata metnini olduğu gibi yapıştırın.
